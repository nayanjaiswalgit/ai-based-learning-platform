version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.4-alpine
    container_name: learning-platform-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-learning_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - learning-platform-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.4-alpine
    container_name: learning-platform-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - learning-platform-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Elasticsearch for search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: learning-platform-search
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - learning-platform-network
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
      target: development
    container_name: learning-platform-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-learning_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
    volumes:
      - ./services/api:/app/services/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/services/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learning-platform-network
    command: pnpm --filter @learning-platform/api dev

  # Code Runner Service
  code-runner:
    build:
      context: .
      dockerfile: ./services/code-runner/Dockerfile
      target: development
    container_name: learning-platform-code-runner
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      NODE_ENV: development
      PORT: 4001
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
    volumes:
      - ./services/code-runner:/app/services/code-runner
      - ./packages:/app/packages
      - /var/run/docker.sock:/var/run/docker.sock
      - /app/node_modules
      - /app/services/code-runner/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - learning-platform-network
    command: pnpm --filter @learning-platform/code-runner dev

  # AI Service
  ai-service:
    build:
      context: .
      dockerfile: ./services/ai-service/Dockerfile
      target: development
    container_name: learning-platform-ai
    restart: unless-stopped
    ports:
      - '4002:4002'
    environment:
      NODE_ENV: development
      PORT: 4002
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
    volumes:
      - ./services/ai-service:/app/services/ai-service
      - ./packages:/app/packages
      - /app/node_modules
      - /app/services/ai-service/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - learning-platform-network
    command: pnpm --filter @learning-platform/ai-service dev

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
      target: development
    container_name: learning-platform-notifications
    restart: unless-stopped
    ports:
      - '4003:4003'
    environment:
      NODE_ENV: development
      PORT: 4003
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
    volumes:
      - ./services/notification-service:/app/services/notification-service
      - ./packages:/app/packages
      - /app/node_modules
      - /app/services/notification-service/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - learning-platform-network
    command: pnpm --filter @learning-platform/notification-service dev

  # Web Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    container_name: learning-platform-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4003
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-nextauth-secret}
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - api
    networks:
      - learning-platform-network
    command: pnpm --filter @learning-platform/web dev

  # Admin Dashboard
  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
      target: development
    container_name: learning-platform-admin
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-nextauth-secret}
    volumes:
      - ./apps/admin:/app/apps/admin
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/admin/node_modules
      - /app/apps/admin/.next
    depends_on:
      - api
    networks:
      - learning-platform-network
    command: pnpm --filter @learning-platform/admin dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  learning-platform-network:
    driver: bridge
