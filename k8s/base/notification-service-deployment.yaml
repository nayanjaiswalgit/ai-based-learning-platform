apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: learning-platform
  labels:
    app: notification-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        component: backend
    spec:
      containers:
        - name: notification-service
          image: learning-platform-notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4003
              name: http
            - containerPort: 4003
              name: websocket
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4003"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: resend-key
            - name: FCM_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: fcm-project-id
          resources:
            requests:
              memory: "256Mi"
              cpu: "125m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: learning-platform
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 4003
      protocol: TCP
      name: http
  selector:
    app: notification-service
