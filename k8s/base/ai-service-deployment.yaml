apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: learning-platform
  labels:
    app: ai-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        component: backend
    spec:
      containers:
        - name: ai-service
          image: learning-platform-ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4002
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4002"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: openai-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: anthropic-key
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: pinecone-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: learning-platform
  labels:
    app: ai-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 4002
      protocol: TCP
      name: http
  selector:
    app: ai-service
