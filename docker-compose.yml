version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.4-alpine
    container_name: learning-platform-db
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./DATABASE_SCHEMA_AGENT9_ADDITIONS.sql:/docker-entrypoint-initdb.d/02-agent9-additions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.4-alpine
    container_name: learning-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bootcamp Service (Agent 9)
  bootcamp-service:
    build:
      context: ./services/bootcamp-service
      dockerfile: Dockerfile
    container_name: bootcamp-service
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/learning_platform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/bootcamp-service/uploads:/app/uploads
    restart: unless-stopped

  # Frontend (Next.js)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: learning-platform-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - bootcamp-service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: learning-platform-network
