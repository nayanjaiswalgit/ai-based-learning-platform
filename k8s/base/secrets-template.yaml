# This is a template for creating Sealed Secrets
# DO NOT commit actual secrets to version control

# To create a sealed secret:
# 1. Create a regular Kubernetes secret YAML file
# 2. Use kubeseal to encrypt it: kubeseal --format yaml < secret.yaml > sealed-secret.yaml
# 3. Apply the sealed secret: kubectl apply -f sealed-secret.yaml

---
# Database Secret Template
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: learning-platform
type: Opaque
stringData:
  url: postgresql://user:password@postgres-service:5432/learning_platform
  host: postgres-service
  port: "5432"
  username: postgres
  password: REPLACE_WITH_ACTUAL_PASSWORD
  database: learning_platform

---
# Redis Secret Template
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: learning-platform
type: Opaque
stringData:
  url: redis://:password@redis-service:6379
  host: redis-service
  port: "6379"
  password: REPLACE_WITH_ACTUAL_PASSWORD

---
# JWT Secret Template
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: learning-platform
type: Opaque
stringData:
  secret: REPLACE_WITH_STRONG_SECRET_AT_LEAST_32_CHARS
  expiresIn: 15m
  refreshSecret: REPLACE_WITH_STRONG_REFRESH_SECRET_AT_LEAST_32_CHARS
  refreshExpiresIn: 7d

---
# AI Services Secrets Template
apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
  namespace: learning-platform
type: Opaque
stringData:
  openai-key: sk-REPLACE_WITH_OPENAI_API_KEY
  anthropic-key: sk-ant-REPLACE_WITH_ANTHROPIC_API_KEY
  pinecone-key: REPLACE_WITH_PINECONE_API_KEY
  pinecone-environment: REPLACE_WITH_PINECONE_ENVIRONMENT
  pinecone-index: learning-platform

---
# Notification Secrets Template
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: learning-platform
type: Opaque
stringData:
  resend-key: re_REPLACE_WITH_RESEND_API_KEY
  fcm-project-id: REPLACE_WITH_FCM_PROJECT_ID
  fcm-private-key: REPLACE_WITH_FCM_PRIVATE_KEY
  fcm-client-email: REPLACE_WITH_FCM_CLIENT_EMAIL

---
# Payment Secrets Template
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: learning-platform
type: Opaque
stringData:
  stripe-secret-key: sk_live_REPLACE_WITH_STRIPE_SECRET
  stripe-webhook-secret: whsec_REPLACE_WITH_STRIPE_WEBHOOK_SECRET
  razorpay-key-id: REPLACE_WITH_RAZORPAY_KEY_ID
  razorpay-key-secret: REPLACE_WITH_RAZORPAY_SECRET
  paypal-client-id: REPLACE_WITH_PAYPAL_CLIENT_ID
  paypal-client-secret: REPLACE_WITH_PAYPAL_CLIENT_SECRET

---
# AWS/S3 Secrets Template
apiVersion: v1
kind: Secret
metadata:
  name: aws-secrets
  namespace: learning-platform
type: Opaque
stringData:
  access-key-id: REPLACE_WITH_AWS_ACCESS_KEY_ID
  secret-access-key: REPLACE_WITH_AWS_SECRET_ACCESS_KEY
  region: us-east-1
  s3-bucket: learning-platform-assets

---
# OAuth Secrets Template
apiVersion: v1
kind: Secret
metadata:
  name: oauth-secrets
  namespace: learning-platform
type: Opaque
stringData:
  google-client-id: REPLACE_WITH_GOOGLE_CLIENT_ID
  google-client-secret: REPLACE_WITH_GOOGLE_CLIENT_SECRET
  github-client-id: REPLACE_WITH_GITHUB_CLIENT_ID
  github-client-secret: REPLACE_WITH_GITHUB_CLIENT_SECRET
  linkedin-client-id: REPLACE_WITH_LINKEDIN_CLIENT_ID
  linkedin-client-secret: REPLACE_WITH_LINKEDIN_CLIENT_SECRET
