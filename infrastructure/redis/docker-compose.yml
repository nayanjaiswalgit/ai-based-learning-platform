version: '3.8'

services:
  redis-node-1:
    image: redis:7.4-alpine
    container_name: redis-7001
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis-node-1-data:/data
      - ./redis-7001.conf:/usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster
    restart: unless-stopped

  redis-node-2:
    image: redis:7.4-alpine
    container_name: redis-7002
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis-node-2-data:/data
      - ./redis-7002.conf:/usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster
    restart: unless-stopped

  redis-node-3:
    image: redis:7.4-alpine
    container_name: redis-7003
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - redis-node-3-data:/data
      - ./redis-7003.conf:/usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster
    restart: unless-stopped

  redis-node-4:
    image: redis:7.4-alpine
    container_name: redis-7004
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "7004:7004"
      - "17004:17004"
    volumes:
      - redis-node-4-data:/data
      - ./redis-7004.conf:/usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster
    restart: unless-stopped

  redis-node-5:
    image: redis:7.4-alpine
    container_name: redis-7005
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "7005:7005"
      - "17005:17005"
    volumes:
      - redis-node-5-data:/data
      - ./redis-7005.conf:/usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster
    restart: unless-stopped

  redis-node-6:
    image: redis:7.4-alpine
    container_name: redis-7006
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "7006:7006"
      - "17006:17006"
    volumes:
      - redis-node-6-data:/data
      - ./redis-7006.conf:/usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster
    restart: unless-stopped

  redis-cluster-init:
    image: redis:7.4-alpine
    container_name: redis-cluster-init
    command: >
      sh -c "
        sleep 10 &&
        redis-cli --cluster create
        redis-node-1:7001
        redis-node-2:7002
        redis-node-3:7003
        redis-node-4:7004
        redis-node-5:7005
        redis-node-6:7006
        --cluster-replicas 1
        --cluster-yes
      "
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    networks:
      - redis-cluster

networks:
  redis-cluster:
    driver: bridge

volumes:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:
