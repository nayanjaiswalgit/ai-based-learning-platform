version: '3.8'

services:
  # Redis for session management
  redis:
    image: redis:7.4-alpine
    container_name: ai-learning-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-learning-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Terminal Service
  terminal-service:
    build:
      context: ./services/terminal-service
      dockerfile: Dockerfile
    container_name: ai-learning-terminal-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=development
      - PORT=3007
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - SESSION_TTL=1800
      - CORS_ORIGIN=http://localhost:3000
      - RECORDINGS_DIR=/app/recordings
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/terminal-service:/app
      - terminal-recordings:/app/recordings
      - /app/node_modules
    networks:
      - ai-learning-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/terminal/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (for future services)
  postgres:
    image: postgres:16.4-alpine
    container_name: ai-learning-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ai_learning
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ai-learning-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  terminal-recordings:
    driver: local

networks:
  ai-learning-network:
    driver: bridge
